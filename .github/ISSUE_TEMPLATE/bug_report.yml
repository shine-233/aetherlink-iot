name: Bug report
description: Report a reproducible problem in AetherLink IoT.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private keys, device credentials, or private customer data.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence of actions or commands.
      placeholder: |
        1. Start ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include a release tag or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Frontend
        - Backend API
        - MQTT broker
        - Docker Compose or deployment
        - Automation tests
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials and personal data before posting.
