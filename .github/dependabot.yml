version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      frontend-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /automation_tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      automation-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      automation-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      backend-go-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      backend-go-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /mqtt-broker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      broker-go-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      broker-go-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /backend/cmd/aetherlink-device-autotest
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      device-autotest-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      backend-docker-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-docker-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /mqtt-broker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      broker-docker-security:
        applies-to: security-updates
        patterns:
          - '*'

  # Keep image tags in Compose manifests on the same maintenance path as
  # Dockerfiles. The root and optional-integration stacks are production
  # deployment inputs; the multidb stack is a maintained test fixture.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      root-compose-images:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      optional-compose-images:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /backend/test/multidb
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      multidb-compose-images:
        patterns:
          - '*'
