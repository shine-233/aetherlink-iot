name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go for Go analysis
        if: matrix.language == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            mqtt-broker/go.sum
            backend/cmd/aetherlink-device-autotest/go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build Go modules for CodeQL
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: 1
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go build ./...)
          (cd mqtt-broker && go build ./...)
          (cd backend/cmd/aetherlink-device-autotest && go build ./...)
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          category: /language:${{ matrix.language }}
