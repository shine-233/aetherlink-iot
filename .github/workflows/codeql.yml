name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for Go analysis
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            mqtt-broker/go.sum
            backend/cmd/aetherlink-device-autotest/go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build Go modules for CodeQL
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: 1
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go build ./...)
          (cd mqtt-broker && go build ./...)
          (cd backend/cmd/aetherlink-device-autotest && go build ./...)
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  alert-gate:
    name: CodeQL alert gate
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Fail closed when this ref has open CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || format('refs/heads/{0}', github.ref_name) }}
        shell: bash
        run: |
          set -euo pipefail
          alerts_file="$(mktemp)"
          gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            -f state=open \
            -f ref="${CODEQL_REF}" \
            -f per_page=100 >"${alerts_file}"

          alert_count="$(jq 'map(.[]) | length' "${alerts_file}")"
          echo "CodeQL open alerts for ${CODEQL_REF}: ${alert_count}"
          if (( alert_count > 0 )); then
            jq -r 'map(.[])[] | "\(.rule.id) | \(.most_recent_instance.location.path // "unknown"):\(.most_recent_instance.location.start_line // 0)"' "${alerts_file}"
            echo "::error::CodeQL alert gate failed: this ref has open CodeQL alerts."
            exit 1
          fi
