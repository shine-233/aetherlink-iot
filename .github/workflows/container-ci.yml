name: Container build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# This is a build-only gate. It must never publish a PR or main image.
permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Container build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aetherlink-iot-backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: aetherlink-iot-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - image: aetherlink-iot-mqtt-broker
            context: ./mqtt-broker
            file: ./mqtt-broker/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          tags: local/${{ matrix.image }}:ci-${{ github.sha }}
          push: false
          provenance: false
          sbom: false
