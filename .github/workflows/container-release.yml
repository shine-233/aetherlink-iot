name: Container image release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  checks: read

concurrency:
  group: container-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release source and checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate release tag and required checks
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          release_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          [[ "$release_sha" == "$GITHUB_SHA" ]]
          [[ "$release_sha" == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main

          required_checks=(
            "Offline release preflight"
            "Frontend build and unit tests"
            "Backend Go tests and build"
            "MQTT broker Go tests and build"
            "Device autotest Go tests and build"
            "Automation contract tests"
            "Dependency review"
            "CodeQL actions"
            "CodeQL go"
            "CodeQL javascript-typescript"
            "CodeQL alert gate"
            "Container build aetherlink-iot-backend"
            "Container build aetherlink-iot-frontend"
            "Container build aetherlink-iot-mqtt-broker"
          )
          check_runs_file="$RUNNER_TEMP/release-check-runs.json"
          # Keep the explicit wait below the 45-minute job timeout so a
          # missing hosted check produces this diagnostic instead of a runner
          # timeout that hides the actual release gate failure.
          for attempt in $(seq 1 80); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs?per_page=100" \
              --jq '.check_runs[]' | jq -s '.' > "$check_runs_file"
            pending=0
            for check_name in "${required_checks[@]}"; do
              latest="$(jq -r --arg name "$check_name" --arg sha "$release_sha" '
                [ .[] | select(.name == $name and .head_sha == $sha and .app.slug == "github-actions") ]
                | if length == 0 then "missing\tmissing\t"
                  else max_by(.id) | [.status, (.conclusion // ""), (.id | tostring)] | @tsv
                  end
              ' "$check_runs_file")"
              IFS=$'\t' read -r status conclusion check_id <<< "$latest"
              case "$status:$conclusion" in
                completed:success)
                  echo "check passed: $check_name (run $check_id)"
                  ;;
                queued:*|in_progress:*|requested:*)
                  echo "check pending: $check_name (status=$status, run=$check_id)"
                  pending=1
                  ;;
                missing:*)
                  echo "check not published yet: $check_name"
                  pending=1
                  ;;
                *)
                  echo "check failed or is not successful: $check_name (status=$status, conclusion=$conclusion, run=$check_id)" >&2
                  exit 1
                  ;;
              esac
            done
            if [[ "$pending" == 0 ]]; then
              break
            fi
            if [[ "$attempt" == 80 ]]; then
              echo "timed out waiting for required checks on $release_sha" >&2
              exit 1
            fi
            sleep 30
          done
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aetherlink-iot-backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: aetherlink-iot-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - image: aetherlink-iot-mqtt-broker
            context: ./mqtt-broker
            file: ./mqtt-broker/Dockerfile
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ needs.validate-tag.outputs.release_sha }}
    steps:
      - name: Check out validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag still points to validated source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          remote_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          [[ "$remote_tag_sha" == "$RELEASE_SHA" ]]
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
          flavor: latest=auto
      - name: Build and push image with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Attest published image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
