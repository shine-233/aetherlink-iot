name: Manual and nightly integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-config:
    name: Integration configuration gate
    runs-on: ubuntu-latest
    environment: integration
    timeout-minutes: 10
    env:
      RUN_LIVE_TESTS: ${{ vars.AETHERLINK_RUN_LIVE_TESTS }}
      API_BASE_URL: ${{ vars.AETHERLINK_API_BASE_URL }}
      API_TARGET: ${{ vars.AETHERLINK_API_TARGET }}
      ALLOWED_ORIGINS: ${{ vars.AETHERLINK_ALLOWED_ORIGINS }}
      ALLOWED_PROXY_ORIGINS: ${{ vars.AETHERLINK_ALLOWED_PROXY_ORIGINS }}
      SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
      TENANT_ADMIN_EMAIL: ${{ secrets.TENANT_ADMIN_EMAIL }}
      TENANT_ADMIN_PASSWORD: ${{ secrets.TENANT_ADMIN_PASSWORD }}
      TENANT_ADMIN_B_EMAIL: ${{ secrets.TENANT_ADMIN_B_EMAIL }}
      TENANT_ADMIN_B_PASSWORD: ${{ secrets.TENANT_ADMIN_B_PASSWORD }}
      TENANT_USER_EMAIL: ${{ secrets.TENANT_USER_EMAIL }}
      TENANT_USER_PASSWORD: ${{ secrets.TENANT_USER_PASSWORD }}
      READONLY_USER_EMAIL: ${{ secrets.READONLY_USER_EMAIL }}
      READONLY_USER_PASSWORD: ${{ secrets.READONLY_USER_PASSWORD }}
      EMAIL_CHANGE_TENANT_EMAIL: ${{ secrets.EMAIL_CHANGE_TENANT_EMAIL }}
      EMAIL_CHANGE_TENANT_PASSWORD: ${{ secrets.EMAIL_CHANGE_TENANT_PASSWORD }}
    steps:
      - name: Validate live integration configuration
        shell: bash
        run: |
          set -euo pipefail
          export ALLOWED_ORIGINS ALLOWED_PROXY_ORIGINS
          node <<'NODE'
          const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
          const required = [
            ['vars.AETHERLINK_RUN_LIVE_TESTS=true', process.env.RUN_LIVE_TESTS === 'true'],
            ['vars.AETHERLINK_API_BASE_URL', Boolean(process.env.API_BASE_URL)],
            ['vars.AETHERLINK_API_TARGET', Boolean(process.env.API_TARGET)],
            ['secrets.SUPER_ADMIN_EMAIL', Boolean(process.env.SUPER_ADMIN_EMAIL)],
            ['secrets.SUPER_ADMIN_PASSWORD', Boolean(process.env.SUPER_ADMIN_PASSWORD)],
            ['secrets.TENANT_ADMIN_EMAIL', Boolean(process.env.TENANT_ADMIN_EMAIL)],
            ['secrets.TENANT_ADMIN_PASSWORD', Boolean(process.env.TENANT_ADMIN_PASSWORD)],
            ['secrets.TENANT_ADMIN_B_EMAIL', Boolean(process.env.TENANT_ADMIN_B_EMAIL)],
            ['secrets.TENANT_ADMIN_B_PASSWORD', Boolean(process.env.TENANT_ADMIN_B_PASSWORD)],
            ['secrets.TENANT_USER_EMAIL', Boolean(process.env.TENANT_USER_EMAIL)],
            ['secrets.TENANT_USER_PASSWORD', Boolean(process.env.TENANT_USER_PASSWORD)],
            ['secrets.READONLY_USER_EMAIL', Boolean(process.env.READONLY_USER_EMAIL)],
            ['secrets.READONLY_USER_PASSWORD', Boolean(process.env.READONLY_USER_PASSWORD)],
            ['secrets.EMAIL_CHANGE_TENANT_EMAIL', Boolean(process.env.EMAIL_CHANGE_TENANT_EMAIL)],
            ['secrets.EMAIL_CHANGE_TENANT_PASSWORD', Boolean(process.env.EMAIL_CHANGE_TENANT_PASSWORD)]
          ];
          const missing = required.filter(([, present]) => !present).map(([name]) => name);

          function validateURL(name, raw, allowlistName, allowlist) {
            let parsed;
            try {
              parsed = new URL(raw);
            } catch {
              missing.push(`${name} must be an absolute URL`);
              return;
            }
            if (!['http:', 'https:'].includes(parsed.protocol) || parsed.username || parsed.password) {
              missing.push(`${name} must be credential-free HTTP(S)`);
              return;
            }
            if (!localHosts.has(parsed.hostname.toLowerCase()) && !allowlist.has(parsed.origin)) {
              missing.push(`${allowlistName} must allow ${parsed.origin}`);
            }
          }

          if (process.env.API_BASE_URL) {
            validateURL(
              'vars.AETHERLINK_API_BASE_URL',
              process.env.API_BASE_URL,
              'vars.AETHERLINK_ALLOWED_ORIGINS',
              new Set(String(process.env.ALLOWED_ORIGINS || '').split(',').map(value => value.trim()).filter(Boolean))
            );
          }
          if (process.env.API_TARGET) {
            validateURL(
              'vars.AETHERLINK_API_TARGET',
              process.env.API_TARGET,
              'vars.AETHERLINK_ALLOWED_PROXY_ORIGINS',
              new Set(String(process.env.ALLOWED_PROXY_ORIGINS || '').split(',').map(value => value.trim()).filter(Boolean))
            );
          }

          if (missing.length > 0) {
            console.error('Live integration is fail-closed. Configure the following GitHub environment integration values:');
            for (const item of [...new Set(missing)]) console.error(`- ${item}`);
            process.exit(1);
          }
          console.log('Live integration configuration gate passed.');
          NODE

  api-e2e-device:
    name: Hosted API, E2E, and device validation
    needs: integration-config
    if: needs.integration-config.result == 'success'
    runs-on: ubuntu-latest
    environment: integration
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automation_tests
    env:
      RUN_LIVE_TESTS: ${{ vars.AETHERLINK_RUN_LIVE_TESTS }}
      AETHERLINK_RUN_LIVE_TESTS: ${{ vars.AETHERLINK_RUN_LIVE_TESTS }}
      CI_STRICT_INTEGRATION: '1'
      API_BASE_URL: ${{ vars.AETHERLINK_API_BASE_URL }}
      API_TARGET: ${{ vars.AETHERLINK_API_TARGET }}
      AETHERLINK_ALLOWED_ORIGINS: ${{ vars.AETHERLINK_ALLOWED_ORIGINS }}
      AETHERLINK_ALLOWED_PROXY_ORIGINS: ${{ vars.AETHERLINK_ALLOWED_PROXY_ORIGINS }}
      FRONTEND_URL: http://127.0.0.1:9725
      PREVIEW_URL: http://127.0.0.1:9725
      PLAYWRIGHT_USE_PREVIEW_PROXY: '1'
      PLAYWRIGHT_REUSE_EXISTING_SERVER: '1'
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ vars.PLAYWRIGHT_BROWSER_CHANNEL || 'msedge' }}
      PREFLIGHT_PROFILE: ${{ vars.AETHERLINK_PREFLIGHT_PROFILE || 'full' }}
      SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
      TENANT_ADMIN_EMAIL: ${{ secrets.TENANT_ADMIN_EMAIL }}
      TENANT_ADMIN_PASSWORD: ${{ secrets.TENANT_ADMIN_PASSWORD }}
      TENANT_ADMIN_B_EMAIL: ${{ secrets.TENANT_ADMIN_B_EMAIL }}
      TENANT_ADMIN_B_PASSWORD: ${{ secrets.TENANT_ADMIN_B_PASSWORD }}
      TENANT_USER_EMAIL: ${{ secrets.TENANT_USER_EMAIL }}
      TENANT_USER_PASSWORD: ${{ secrets.TENANT_USER_PASSWORD }}
      READONLY_USER_EMAIL: ${{ secrets.READONLY_USER_EMAIL }}
      READONLY_USER_PASSWORD: ${{ secrets.READONLY_USER_PASSWORD }}
      EMAIL_CHANGE_TENANT_EMAIL: ${{ secrets.EMAIL_CHANGE_TENANT_EMAIL }}
      EMAIL_CHANGE_TENANT_PASSWORD: ${{ secrets.EMAIL_CHANGE_TENANT_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.8.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend preview assets
        working-directory: frontend
        run: pnpm run build
      - name: Set up npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation_tests/package-lock.json
      - name: Install automation dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps "$PLAYWRIGHT_BROWSER_CHANNEL"
      - name: Start preview API proxy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve_preview_with_api_proxy.js > "$RUNNER_TEMP/aetherlink-preview-proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aetherlink-preview-proxy.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PREVIEW_URL/" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/aetherlink-preview-proxy.log"
          exit 1
      - name: Run API and E2E preflight
        env:
          PLAYWRIGHT_REUSE_EXISTING_SERVER: '0'
        run: npm run preflight:api-e2e
      - name: Run API automation
        run: npm run test:automation:api
      - name: Run Playwright E2E
        run: npm run test:automation:e2e
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-reports-${{ github.run_id }}
          path: |
            automation_tests/reports/
            automation_tests/test-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop preview API proxy
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/aetherlink-preview-proxy.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/aetherlink-preview-proxy.pid")" 2>/dev/null || true
          fi

  integration-result:
    name: Integration result
    if: always()
    needs:
      - integration-config
      - api-e2e-device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed when live integration did not run successfully
        shell: bash
        env:
          CONFIG_RESULT: ${{ needs.integration-config.result }}
          TEST_RESULT: ${{ needs.api-e2e-device.result }}
        run: |
          set -euo pipefail
          if [[ "$CONFIG_RESULT" != "success" ]]; then
            echo "Live integration is fail-closed: configuration gate result=$CONFIG_RESULT; API/E2E/device tests were not run." >&2
            exit 1
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Live integration is fail-closed: hosted API/E2E/device result=$TEST_RESULT." >&2
            exit 1
          fi
          echo "Hosted live integration completed successfully."
