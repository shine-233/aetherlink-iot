name: Minimum quality gate

on:
  pull_request:
  push:
  workflow_dispatch:

# This offline gate only reads the checkout; hosted/external checks remain explicit not-run results.
permissions:
  contents: read

concurrency:
  group: minimum-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Offline release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run minimum quality gate
        run: node automation_tests/scripts/release_preflight.js
