name: Minimum quality gate

on:
  pull_request:
  push:
  workflow_dispatch:

# This offline gate only reads the checkout; hosted/external checks remain explicit not-run results.
permissions:
  contents: read

concurrency:
  group: minimum-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Offline release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run minimum quality gate
        run: node automation_tests/scripts/release_preflight.js
