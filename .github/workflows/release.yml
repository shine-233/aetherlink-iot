name: Source release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  checks: read

concurrency:
  group: source-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release source and checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate release tag and required checks
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          release_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          [[ "$release_sha" == "$GITHUB_SHA" ]]
          [[ "$release_sha" == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main

          required_checks=(
            "Offline release preflight"
            "Frontend build and unit tests"
            "Backend Go tests and build"
            "MQTT broker Go tests and build"
            "Device autotest Go tests and build"
            "Automation contract tests"
            "Dependency review"
            "CodeQL actions"
            "CodeQL go"
            "CodeQL javascript-typescript"
            "CodeQL alert gate"
            "Container build aetherlink-iot-backend"
            "Container build aetherlink-iot-frontend"
            "Container build aetherlink-iot-mqtt-broker"
          )
          check_runs_file="$RUNNER_TEMP/release-check-runs.json"
          # Keep the explicit wait below the 45-minute job timeout so a
          # missing hosted check produces this diagnostic instead of a runner
          # timeout that hides the actual release gate failure.
          for attempt in $(seq 1 80); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs?per_page=100" \
              --jq '.check_runs[]' | jq -s '.' > "$check_runs_file"
            pending=0
            for check_name in "${required_checks[@]}"; do
              latest="$(jq -r --arg name "$check_name" --arg sha "$release_sha" '
                [ .[] | select(.name == $name and .head_sha == $sha and .app.slug == "github-actions" and .conclusion != "skipped") ]
                | if length == 0 then "missing\tmissing\t"
                  else max_by(.id) | [.status, (.conclusion // ""), (.id | tostring)] | @tsv
                  end
              ' "$check_runs_file")"
              IFS=$'\t' read -r status conclusion check_id <<< "$latest"
              case "$status:$conclusion" in
                completed:success)
                  echo "check passed: $check_name (run $check_id)"
                  ;;
                queued:*|in_progress:*|requested:*)
                  echo "check pending: $check_name (status=$status, run=$check_id)"
                  pending=1
                  ;;
                missing:*)
                  echo "check not published yet: $check_name"
                  pending=1
                  ;;
                *)
                  echo "check failed or is not successful: $check_name (status=$status, conclusion=$conclusion, run=$check_id)" >&2
                  exit 1
                  ;;
              esac
            done
            if [[ "$pending" == 0 ]]; then
              break
            fi
            if [[ "$attempt" == 80 ]]; then
              echo "timed out waiting for required checks on $release_sha" >&2
              exit 1
            fi
            sleep 30
          done
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub source release
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag still points to validated source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.validate-tag.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          remote_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          [[ "$remote_tag_sha" == "$RELEASE_SHA" ]]
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
      - name: Build source archive and checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.validate-tag.outputs.release_sha }}
        run: |
          set -euo pipefail
          archive="aetherlink-iot-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz --prefix="aetherlink-iot-${RELEASE_TAG}/" "$RELEASE_SHA" > "$archive"
          sha256sum "$archive" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Generate source SBOM
        shell: bash
        run: |
          set -euo pipefail
          node automation_tests/scripts/generate_local_sbom.js --output source-sbom.json
          sha256sum source-sbom.json >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat source-sbom.json
          cat SHA256SUMS.txt
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: aetherlink-iot-${{ github.ref_name }}.tar.gz
      - name: Attest source SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: source-sbom.json
      - name: Attest release checksums provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS.txt
      - name: Create GitHub Release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.validate-tag.outputs.release_sha }}
        run: |
          set -euo pipefail
          remote_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          [[ "$remote_tag_sha" == "$RELEASE_SHA" ]]
          gh release create "$RELEASE_TAG" \
            "aetherlink-iot-${RELEASE_TAG}.tar.gz" \
            source-sbom.json \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "AetherLink IoT ${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
