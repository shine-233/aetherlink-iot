name: Source release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub source release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
      - name: Build source archive and checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          archive="aetherlink-iot-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz --prefix="aetherlink-iot-${RELEASE_TAG}/" "$RELEASE_TAG" > "$archive"
          sha256sum "$archive" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "aetherlink-iot-${RELEASE_TAG}.tar.gz" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "AetherLink IoT ${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
