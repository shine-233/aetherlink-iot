# 文件用途：定义后端 Casbin 权限模型。
# 维护提示：这里只描述权限匹配规则，不存放具体用户、角色或资源策略数据。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _
g2 = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && g2(r.obj, p.obj) && r.act == p.act
