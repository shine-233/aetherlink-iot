# 文件用途：定义后端 Casbin 权限模型。
# 维护提示：这里只描述权限匹配规则，不存放具体用户、角色或资源策略数据。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _
g2 = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# 资源匹配双通道：g2 分组（既有约定：具体 URL 挂到资源组）或 urlPatternMatch 锚定模式
# （p.obj 可写 RESTful 模式如 api/v1/device/:id，与 gin 参数路由对齐）。
# urlPatternMatch 由 initialize.CasbinInit 经 AddFunction 注入（锚定实现，防子串误命中），
# 与 GetUrl 的模式判定同源；两者并存保证既有 (具体URL→资源组) 数据继续生效。
m = g(r.sub, p.sub) && (g2(r.obj, p.obj) || urlPatternMatch(r.obj, p.obj)) && r.act == p.act
