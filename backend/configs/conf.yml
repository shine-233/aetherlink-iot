# AetherLink IoT 默认后端配置入口。
# 修改配置值前请确认当前启动环境确实读取本文件，避免影响本地或演示环境。

# 如需在系统变量中设置配置项，可使用GOTP_开头的变量名，如：GOTP_DB_PSQL_DBTYPE为db.psql.dbType

service:
  http:
    host: 0.0.0.0 # 默认localhost
    port: # 默认9999

cors:
  # 生产默认通过同源 Nginx 反代访问 API，不开放跨域。
  # 如果前后端分离为不同域名，请显式配置可信前端 Origin。
  allowed_origins: []
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["Content-Type", "Authorization", "X-Token", "X-API-Key", "Accept-Language"]
  allow_credentials: false

deployment:
  # 公网控制台地址，用于生成密码重置邮件链接；留空时生成同域相对路径。
  public_url: ""

log:
  # 0-控制台输出 1-文件输出 2-文件和控制台输出
  adapter_type: 0
  # 日志文件保存路径，如果不配置则默认使用 ./files/logs
  # path: ./files/logs
  # 文件最多保存多少天
  maxdays: 7
  # 日志级别 (panic fatal error warn info debug trace)
  level: info # 默认info
  # 每个日志文件的最大大小（单位：MB），达到此大小后会自动轮转
  maxsize: 100

jwt:
  key: CHANGE_ME_JWT_SECRET  # 建议通过环境变量 GOTP_JWT_KEY 设置

market:
  # 外部市场是可选能力；只有同时显式启用并配置有效 base_url 时才允许出站请求。
  enabled: false
  base_url: "" # 市场服务地址；未接入市场服务时保持为空，避免误访问示例域名

db:
  psql:
    host: 127.0.0.1 # 默认localhost
    port: 5432 # 默认5432
    dbname: aetherlink_iot
    username: postgres
    password: CHANGE_ME_VIA_GOTP_DB_PSQL_PASSWORD
    time_zone: Asia/Shanghai # 默认Asia/Shanghai

    idle_conns: 5 # 空闲连接池中的最大连接数，建议为open_conns的百分之5-20之间
    open_conns: 50 # 最大打开连接数；默认部署使用PostgreSQL 16，需结合实例上限和其他服务连接数调整
    # SQL日志级别 (1-静音 2-错误 3-警告 4-信息)
    log_level: 2 # 默认1
    # 慢SQL阈值（毫秒）。慢SQL会在sqlloglevel大于等于3时输出。
    slow_threshold: 200 # 默认200毫秒

  redis:
    addr: 127.0.0.1:6379 # 默认localhost:6379
    db: 1 # 默认0
    db1: 10 # 默认10，不能是0，用户设备状态管理
    password: "CHANGE_ME_VIA_GOTP_DB_REDIS_PASSWORD"

grpc:
  tptodb_server: 127.0.0.1:50052
  tptodb_type: NONE # NONE、TSDB

# mqtt服务：gmqtt、vernemq
mqtt_server: gmqtt

mqtt:
  enabled: true
  access_address: 127.0.0.1:1883
  broker: 127.0.0.1:1883 # 默认localhost:1883
  client_id: aetherlink-adapter-1
  user: CHANGE_ME_VIA_GOTP_MQTT_USER # 默认root，生产环境必须修改
  pass: CHANGE_ME_VIA_GOTP_MQTT_PASS # 默认root，生产环境必须修改
  channel_buffer_size: 1000 # 默认10000
  # 启用共享订阅：true、false
  enable_shared_subscription: false
  # 共享订阅组名
  shared_subscription_group: aetherlink
  write_workers: 1 # 消息队列入库线程数，默认10
  #消息服务质量 0：消息最多传递一次，如果当时客户端不可用，则会丢失该消息。1：消息传递至少 1 次。2：消息仅传送一次。
  # 以下主题都为默认主题
  telemetry:
    # devices/telemetry/control/{device_number}
    # 如果发给协议插件，则是devices/telemetry/control/{device_id}
    publish_topic: devices/telemetry/control/
    subscribe_topic: devices/telemetry
    gateway_subscribe_topic: gateway/telemetry
    #gateway/telemetry/{device_number}/+
    gateway_publish_topic: gateway/telemetry/control/%s
    pool_size: 10 # 消息处理线程池，默认100
    batch_size: 100 # 默认100 最大一次批量写入数据库的数据量
    qos: 0
  attributes:
    # 订阅属性：+位置是{message_id}
    subscribe_topic: devices/attributes/+
    # 发布接收属性响应：devices/attributes/response/{device_number}/{message_id}
    publish_response_topic: devices/attributes/response/
    # 发布设置属性请求：devices/attributes/set/{device_number}/{message_id}
    publish_topic: devices/attributes/set/
    # 订阅设置属性响应：+位置是{message_id}
    subscribe_response_topic: devices/attributes/set/response/+
    # 发布获取属性请求：devices/attributes/get/{device_number}
    publish_get_topic: devices/attributes/get/

    # 设备属性上报 gateway/attributes/{message_id}
    gateway_subscribe_topic: gateway/attributes/+
    # 订阅平台收到属性的响应  gateway/attributes/response/{device_number}/+
    gateway_publish_response_topic: gateway/attributes/response/%s/%s
    # 平台设置设备属性 gateway/attributes/set/{device_number}/+
    gateway_publish_topic: gateway/attributes/set/%s/%s
    # 平台设置属性 设备响应 gateway/attributes/set/response/{message_id}
    gateway_subscribe_response_topic: gateway/attributes/set/response/+
    # 平台下发请求获取属性 gateway/attributes/get/{device_number}
    gateway_publish_get_topic: gateway/attributes/get/%s

    qos: 1
  commands:
    # devices/command/{device_number}/{message_id}
    publish_topic: devices/command/
    subscribe_topic: devices/command/response/+
    # 设备接受命令回应 gateway/command/response/{message_id}
    gateway_subscribe_topic: gateway/command/response/+
    # 下发命令 gateway/command/{device_number}/+
    gateway_publish_topic: gateway/command/
    # 测试
    # gateway_publish_topic: devices/command/%s/%s
    qos: 1
  events:
    # 订阅事件：+位置是message_id
    subscribe_topic: devices/event/+
    # 发布事件响应：devices/event/response/{device_number}/{message_id}
    publish_topic: devices/event/response/

    # 设备上报事件 gateway/event/{message_id}
    gateway_subscribe_topic: gateway/event/+
    # 平台接受到事件响应 gateway/event/response/{device_number}/+
    gateway_publish_topic: gateway/event/response/%s/%s

    qos: 1
  ota:
    # ota升级包消息推送：ota/devices/inform/{device_number}
    publish_topic: ota/devices/inform/
    subscribe_topic: ota/devices/progress
    qos: 1



mqtts:
  broker: 127.0.0.1:8883
  user: CHANGE_ME_VIA_GOTP_MQTTS_USER
  pass: CHANGE_ME_VIA_GOTP_MQTTS_PASS
  caPath : ./conf/certificate/ca.crt
  crtPath: ./conf/certificate/client.crt
  keyPath : ./conf/certificate/client.key

automation_task_confg:
  once_task_limit: 100
  periodic_task_limit: 100

ota:
 # 推送设备端的ota升级包下载地址
  download_address: http://127.0.0.1:8080

classified-protect:
  # 连续登录失败次数则锁定，-1表示不受限制，可以一直尝试登录
  login-max-fail-times: -1
  # 连续登录失败锁定时间（单位：秒），-1表示不锁定
  login-fail-locked-seconds: 300

# 会话设置
session:
  # 会话超时时间（以分钟为单位）
  timeout: 6000
  # 可选：是否在每次请求时重置超时时间
  reset_on_request: false

# Command Jobs 跨实例下发治理；数据库配额是强制门禁，进程内计时只负责到点唤醒。
command_jobs:
  dispatch:
    global_max_concurrent: 16
    tenant_max_concurrent: 4
    global_rate_per_second: 20
    tenant_rate_per_second: 5
    contention_retry_interval: "500ms"
    gate_wait_limit: "2s"

# Storage 存储层配置
storage:
  channel_buffer_size: 1000       # 输入channel缓冲区大小
  telemetry_batch_size: 500        # 遥测数据批量大小
  telemetry_flush_interval: 1000   # flush间隔（毫秒，0表示关闭定时flush）
  enable_metrics: true             # 是否启用Prometheus监控
  telemetry_write_ahead_spool_enabled: true
  # 主PostgreSQL和数据库dead-letter都不可写时的独立持久兜底。
  # 文件包含原始遥测值；生产目录必须放在持久卷上，限制访问，并按数据等级启用磁盘加密。
  telemetry_spool:
    enabled: true
    directory: "./data/telemetry-spool" # 必须位于公开 /files 根目录之外
    max_bytes: 536870912            # 512 MiB逻辑JSON上限；满容量时不会淘汰旧点
    max_records: 100000             # 达上限后拒绝假成功并输出错误
    max_record_bytes: 16777216      # 单点JSON最大16 MiB，防止单点耗尽容量/重放内存
    replay_interval: "30s"
    replay_batch_size: 100
    replay_timeout: "10s"
  # envelope 可包含原始 attribute/event；必须放在非公开持久卷，限制权限并按数据等级启用磁盘加密。
  # 容量或记录数达到上限时不会淘汰旧 envelope，而是拒绝无法耐久化的新写入。
  attribute_event_spool:
    enabled: true
    directory: "./data/uplink-spool" # 必须位于公开 /files 根目录之外
    max_bytes: 536870912            # 512 MiB逻辑JSON上限
    max_records: 100000             # 每条记录对应一个完整 envelope
    max_record_bytes: 16777216      # 单 envelope 最大16 MiB
    replay_interval: "30s"
    replay_batch_size: 100
    replay_timeout: "10s"

# Uplink 数据流处理层配置
uplink:
  enable: true                     # 是否启用Uplink层（默认true）
  bus_buffer_size: 1000           # Bus消息总线缓冲区大小

# Diagnostics 设备诊断配置
diagnostics:
  enabled: true                    # 是否启用设备诊断（关闭时不启动监控）
  max_failures: 5                  # 保留失败记录数
  batch_flush_size: 100             # 批量刷新大小（异步缓冲）
  batch_flush_interval: 1s         # 批量刷新间隔
  persist_to_db: false             # 是否持久化到数据库（服务重启后保留）

# Heartbeat 心跳监控配置
heartbeat:
  subscribe:
    enabled: true                  # 是否订阅 Redis 过期事件（默认 true，未配置时启用）

# Telemetry 安装量监测配置
telemetry:
  enabled: false                 # 仅发送匿名实例级遥测，可随时开启
  posthog_key: ""  # Optional PostHog API key; leave empty to keep telemetry disabled.
  posthog_host: ""
  heartbeat_interval: "1h"
  state_file: "./configs/.telemetry_state.json"
#                                    # 多实例部署时，只有一个实例设为 true，其他实例设为 false

# Telemetry dead-letter 自动重放配置
telemetry_dead_letters:
  worker:
    enabled: true                  # 是否启用常驻 dead-letter 自动 drain worker
    interval: "30s"                # 自动 drain 间隔
    limit: 20                      # 单轮最多重放条数，最大 100
    shutdown_timeout: "5s"         # 停机等待 worker 退出并尝试最后一次 drain 的总时间预算

# SW3/MQTT 会话撤销 outbox 重试配置
mqtt_session_revocations:
  ack_timeout: "30s"              # 命令发布后等待 broker 处理 ACK 的时间，超时后重新投递
  required_broker_ids: []          # 空数组表示任一 broker ACK 即完成；非空时必须收齐名单内全部 ACK
  worker:
    enabled: true                  # 是否启用常驻撤销 outbox worker
    interval: "10s"                # 到期撤销事件扫描间隔
    limit: 20                      # 单轮最多 claim 条数，最大 100
    shutdown_timeout: "3s"         # 停机等待当前 worker 退出的时间预算
