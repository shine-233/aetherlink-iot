# 文件用途：提供显式启用的本地多数据库测试辅助栈，包含 MySQL、PostgreSQL 和 Adminer。
# 核心逻辑：使用固定镜像版本和示例密码启动一次性测试服务，端口只绑定到本机回环地址。
# 关键注意事项：该 profile 仅用于开发测试，示例密码和 Adminer 不可用于生产环境。
# 重构建议：需要自动化多数据库验证时，再补一次性初始化与健康检查，不要并入默认部署栈。
version: '3.9'

services:
  db:
    image: mysql:8.4
    profiles: [multidb-test]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: example
    ports:
      - "127.0.0.1:3306:3306"

  db2:
    image: postgres:16-alpine
    profiles: [multidb-test]
    restart: "no"
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "127.0.0.1:5432:5432"

  adminer:
    image: adminer:4.8.1
    profiles: [multidb-test]
    restart: "no"
    environment:
      - ADMINER_DESIGN=pepa-linha
    ports:
      - "127.0.0.1:8080:8080"
