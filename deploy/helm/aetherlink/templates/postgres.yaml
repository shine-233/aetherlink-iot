{{- /* 文件用途：渲染内置 PostgreSQL StatefulSet（postgresql.enabled=false 时不渲染任何对象）。
核心逻辑：镜像/库对齐根 compose（postgres:18-alpine）；数据卷挂 /var/lib/postgresql（PG18 的
PGDATA 位于 /var/lib/postgresql/18/docker，与 compose 同口径）；首次建库由 backend 启动迁移
（initialize/pg_init.go CheckVersion 全链 1..N，单事务），无需 entrypoint 初始化脚本。
关键注意事项：迁移记录在 sys_version——backend 多副本首启由 StatefulSet OrderedReady 串行化，
不要手工绕过；PVC 模板升级不受 helm upgrade 影响（改 size/存储类需手工迁移卷）；
生产建议直接关闭本开关使用外部 PG（配合 deploy/backup-restore 体系）。
重构建议：需要 TimescaleDB 时另建衍生镜像并显式设置 AETHERLINK_TIMESCALE_MODE，不改本模板。 */}}
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aetherlink-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
    {{- range $k, $v := .Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  replicas: 1
  podManagementPolicy: OrderedReady
  serviceName: {{ .Release.Name }}-postgres-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: aetherlink-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aetherlink-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
        {{- range $k, $v := .Values.commonLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      # 所有组件都不调用 Kubernetes API，不挂载 SA token 以缩小凭据暴露面。
      automountServiceAccountToken: false
      # 官方 postgres 镜像 entrypoint 需要 root 做 chown 后降权到 postgres，
      # 对齐 compose：postgres 服务不加 cap_drop/security_opt，仅加 seccomp 基线。
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag | default "18-alpine" }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
          # 对齐 compose：postgres 服务不做 cap_drop/no-new-privileges（entrypoint 需要
          # chown 数据卷后降权），仅保留容器级 seccomp 基线。
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.postgresql.config }}
          # 对齐 compose postgres command：values.postgresql.config 的每个键值渲染为 -c key=value。
          args:
            {{- range $key, $value := . }}
            - -c
            - {{ printf "%s=%v" $key $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | default "aetherlink_iot" | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | default "postgres" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-aetherlink" .Release.Name) }}
                  key: postgres-password
          # 对齐 compose postgres 健康检查：-h 127.0.0.1 强制 TCP，避免 entrypoint
          # 临时服务（仅 socket）阶段提前变绿放行依赖方（docker-compose.yml 同因注释）。
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: {{ .Values.postgresql.resources.requests.cpu | quote }}
              memory: {{ .Values.postgresql.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgresql.resources.limits.cpu | quote }}
              memory: {{ .Values.postgresql.resources.limits.memory | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.storage.storageClass }}
        storageClassName: {{ .Values.postgresql.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aetherlink-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
    {{- range $k, $v := .Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aetherlink-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
{{- /* headless Service：StatefulSet serviceName 必需。 */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aetherlink-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
    {{- range $k, $v := .Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: aetherlink-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: pg
      port: 5432
      targetPort: pg
{{- end }}
