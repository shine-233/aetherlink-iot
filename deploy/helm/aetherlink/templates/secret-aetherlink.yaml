{{- /* 文件用途：渲染 chart 级 Secret（JWT/PG/Redis/MQTT root/MQTT plugin 五组密钥，TB-11）。
核心逻辑：secrets.existingSecret 非空时不渲染任何对象，直接引用既有 Secret 的固定键名；
为空时用 values.secrets 明文值渲染本 Secret，且每个键 required fail-fast，拒绝空密钥安装。
关键注意事项：stringData 里是明文——真实密钥只允许出现在受控 values 文件或外部 Secret，
绝不能把真实值提交回本 chart；键名变更需同步全部 secretKeyRef 引用与 README 键名清单。
重构建议：若引入 cert-manager 或 sealed-secrets，保留既有 Secret 键名契约不变。 */}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-aetherlink
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aetherlink
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: secrets
    {{- range $k, $v := .Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
type: Opaque
stringData:
  jwt-key: {{ required "secrets.jwtKey is required when secrets.existingSecret is empty" .Values.secrets.jwtKey | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required when secrets.existingSecret is empty" .Values.secrets.postgresPassword | quote }}
  redis-password: {{ required "secrets.redisPassword is required when secrets.existingSecret is empty" .Values.secrets.redisPassword | quote }}
  mqtt-root-password: {{ required "secrets.mqttRootPassword is required when secrets.existingSecret is empty" .Values.secrets.mqttRootPassword | quote }}
  mqtt-plugin-password: {{ required "secrets.mqttPluginPassword is required when secrets.existingSecret is empty" .Values.secrets.mqttPluginPassword | quote }}
{{- end }}
