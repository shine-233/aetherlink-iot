# Prometheus alerts for the backend attribute/event durable-envelope spool.
# Metric source: backend/internal/storage/metrics.go.
# Expressions remain per scrape target because every backend instance owns an
# independent spool directory and capacity budget.
groups:
  - name: aetherlink.attribute-event-spool
    rules:
      - alert: AetherLinkAttributeEventSpoolActivated
        expr: |
          increase(aetherlink_storage_attribute_event_spool_durable_fallback_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
          component: attribute-event-spool
        annotations:
          summary: "Attribute/event file fallback is active on {{ $labels.instance }}"
          description: >-
            The backend retained one or more complete attribute/event envelopes
            in its private file spool during the last 10 minutes for
            job={{ $labels.job }}, instance={{ $labels.instance }} (observed
            increase={{ $value }}). Both the primary transaction and PostgreSQL
            uplink dead-letter path failed before this fallback was used.
          runbook: "deploy/observability/README.md#attributeevent-spool-activated"

      - alert: AetherLinkAttributeEventSpoolWriteFailure
        expr: |
          increase(aetherlink_storage_attribute_event_spool_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
          component: attribute-event-spool
        annotations:
          summary: "Attribute/event spool write failed on {{ $labels.instance }}"
          description: >-
            The final private-file durability tier failed during the last 10
            minutes for job={{ $labels.job }}, instance={{ $labels.instance }}
            (observed increase={{ $value }}). An accepted uplink consumer may
            have failed to obtain any durable storage receipt.
          runbook: "deploy/observability/README.md#attributeevent-spool-write-failure"

      - alert: AetherLinkAttributeEventSpoolCorruptionDetected
        expr: |
          increase(aetherlink_storage_attribute_event_spool_corrupt_total[15m]) > 0
        for: 2m
        labels:
          severity: warning
          component: attribute-event-spool
        annotations:
          summary: "Attribute/event spool corruption detected on {{ $labels.instance }}"
          description: >-
            Integrity validation found corrupt attribute/event envelopes during
            the last 15 minutes for job={{ $labels.job }},
            instance={{ $labels.instance }} (observed increase={{ $value }}).
            Quarantined envelopes are not replayed automatically.
          runbook: "deploy/observability/README.md#attributeevent-spool-corruption"

      - alert: AetherLinkAttributeEventSpoolBacklogPersistent
        expr: |
          aetherlink_storage_attribute_event_spool_backlog_records > 0
        for: 15m
        labels:
          severity: warning
          component: attribute-event-spool
        annotations:
          summary: "Attribute/event spool backlog persists on {{ $labels.instance }}"
          description: >-
            Complete attribute/event envelopes have remained in the private
            spool for 15 minutes for job={{ $labels.job }},
            instance={{ $labels.instance }} (current records={{ $value }}).
            Backlog includes quarantine records that require manual handling.
          runbook: "deploy/observability/README.md#attributeevent-spool-backlog"

      - alert: AetherLinkAttributeEventSpoolRecordsNearCapacity
        expr: |
          (
            aetherlink_storage_attribute_event_spool_backlog_records
            /
            aetherlink_storage_attribute_event_spool_capacity_records
          ) >= 0.80
          and
          aetherlink_storage_attribute_event_spool_capacity_records > 0
        for: 10m
        labels:
          severity: warning
          component: attribute-event-spool
          threshold: "0.80"
        annotations:
          summary: "Attribute/event spool record capacity is above 80% on {{ $labels.instance }}"
          description: >-
            Record-count usage for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.80 for
            10 minutes (current ratio={{ $value }}).
          runbook: "deploy/observability/README.md#attributeevent-spool-capacity"

      - alert: AetherLinkAttributeEventSpoolBytesNearCapacity
        expr: |
          (
            aetherlink_storage_attribute_event_spool_bytes
            /
            aetherlink_storage_attribute_event_spool_capacity_bytes
          ) >= 0.80
          and
          aetherlink_storage_attribute_event_spool_capacity_bytes > 0
        for: 10m
        labels:
          severity: warning
          component: attribute-event-spool
          threshold: "0.80"
        annotations:
          summary: "Attribute/event spool byte capacity is above 80% on {{ $labels.instance }}"
          description: >-
            Logical-byte usage for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.80 for
            10 minutes (current ratio={{ $value }}).
          runbook: "deploy/observability/README.md#attributeevent-spool-capacity"

      - alert: AetherLinkAttributeEventSpoolRecordsCriticalCapacity
        expr: |
          (
            aetherlink_storage_attribute_event_spool_backlog_records
            /
            aetherlink_storage_attribute_event_spool_capacity_records
          ) >= 0.95
          and
          aetherlink_storage_attribute_event_spool_capacity_records > 0
        for: 2m
        labels:
          severity: critical
          component: attribute-event-spool
          threshold: "0.95"
        annotations:
          summary: "Attribute/event spool record capacity is above 95% on {{ $labels.instance }}"
          description: >-
            Record-count usage for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.95 for
            2 minutes (current ratio={{ $value }}). New fallback envelopes are
            at imminent risk of rejection.
          runbook: "deploy/observability/README.md#attributeevent-spool-capacity"

      - alert: AetherLinkAttributeEventSpoolBytesCriticalCapacity
        expr: |
          (
            aetherlink_storage_attribute_event_spool_bytes
            /
            aetherlink_storage_attribute_event_spool_capacity_bytes
          ) >= 0.95
          and
          aetherlink_storage_attribute_event_spool_capacity_bytes > 0
        for: 2m
        labels:
          severity: critical
          component: attribute-event-spool
          threshold: "0.95"
        annotations:
          summary: "Attribute/event spool byte capacity is above 95% on {{ $labels.instance }}"
          description: >-
            Logical-byte usage for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.95 for
            2 minutes (current ratio={{ $value }}). New fallback envelopes are
            at imminent risk of rejection.
          runbook: "deploy/observability/README.md#attributeevent-spool-capacity"

      - alert: AetherLinkAttributeEventSpoolQuarantinePresent
        expr: |
          aetherlink_storage_attribute_event_spool_quarantine_records > 0
        for: 5m
        labels:
          severity: critical
          component: attribute-event-spool
        annotations:
          summary: "Attribute/event spool quarantine is non-empty on {{ $labels.instance }}"
          description: >-
            Quarantined attribute/event envelopes have remained for five
            minutes for job={{ $labels.job }}, instance={{ $labels.instance }}
            (current records={{ $value }}). They are excluded from automatic
            replay and continue to consume the configured capacity.
          runbook: "deploy/observability/README.md#attributeevent-spool-quarantine"
