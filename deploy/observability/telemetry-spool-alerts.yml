# Prometheus alerts for the backend telemetry file spool.
# Metric source: backend/internal/storage/metrics.go.
# Expressions intentionally remain per scrape target; see README.md before aggregating replicas.
groups:
  - name: aetherlink.telemetry-spool
    rules:
      - alert: AetherLinkTelemetrySpoolActivated
        expr: |
          increase(AetherLinkIoT_storage_telemetry_spooled_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
          component: telemetry-spool
        annotations:
          summary: "Telemetry spool is receiving fallback writes on {{ $labels.instance }}"
          description: >-
            The AetherLink backend stored telemetry in the independent file
            spool during the last 10 minutes for job={{ $labels.job }},
            instance={{ $labels.instance }} (observed increase={{ $value }}).
            The durable fallback is working, but PostgreSQL and database
            dead-letter writes should be investigated before backlog grows.
          runbook: "deploy/observability/README.md#spool-activated"

      - alert: AetherLinkTelemetrySpoolWriteFailure
        expr: |
          increase(AetherLinkIoT_storage_telemetry_spool_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
          component: telemetry-spool
        annotations:
          summary: "Telemetry spool write failed on {{ $labels.instance }}"
          description: >-
            The AetherLink backend reported a telemetry file-spool persistence
            failure during the last 10 minutes for job={{ $labels.job }},
            instance={{ $labels.instance }} (observed increase={{ $value }}).
            The fallback may no longer have a durable copy of every failed
            telemetry point.
          runbook: "deploy/observability/README.md#write-failure"

      - alert: AetherLinkTelemetrySpoolCorruptionDetected
        expr: |
          increase(AetherLinkIoT_storage_telemetry_spool_corrupt_total[15m]) > 0
        for: 2m
        labels:
          severity: warning
          component: telemetry-spool
        annotations:
          summary: "Telemetry spool corruption detected on {{ $labels.instance }}"
          description: >-
            The AetherLink backend detected one or more corrupt telemetry spool
            records during the last 15 minutes for job={{ $labels.job }},
            instance={{ $labels.instance }} (observed increase={{ $value }}).
            Inspect retained quarantine files and the underlying storage.
          runbook: "deploy/observability/README.md#corruption-detected"

      - alert: AetherLinkTelemetrySpoolBacklogPersistent
        expr: |
          AetherLinkIoT_storage_telemetry_spool_backlog_records > 0
        for: 15m
        labels:
          severity: warning
          component: telemetry-spool
        annotations:
          summary: "Telemetry spool backlog persists on {{ $labels.instance }}"
          description: >-
            The telemetry spool for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained non-empty for 15
            minutes (current records={{ $value }}). Backlog includes retained
            quarantine records; check the quarantine alert before treating this
            only as replay lag.
          runbook: "deploy/observability/README.md#persistent-backlog"

      - alert: AetherLinkTelemetrySpoolRecordsNearCapacity
        expr: |
          (
            AetherLinkIoT_storage_telemetry_spool_backlog_records
            /
            AetherLinkIoT_storage_telemetry_spool_capacity_records
          ) >= 0.80
          and
          AetherLinkIoT_storage_telemetry_spool_capacity_records > 0
        for: 10m
        labels:
          severity: warning
          component: telemetry-spool
          threshold: "0.80"
        annotations:
          summary: "Telemetry spool record capacity is above 80% on {{ $labels.instance }}"
          description: >-
            The record-count usage ratio for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.80 for
            10 minutes (current ratio={{ $value }}). The denominator is the
            effective max_records value exported by that backend instance.
          runbook: "deploy/observability/README.md#capacity-near-limit"

      - alert: AetherLinkTelemetrySpoolBytesNearCapacity
        expr: |
          (
            AetherLinkIoT_storage_telemetry_spool_bytes
            /
            AetherLinkIoT_storage_telemetry_spool_capacity_bytes
          ) >= 0.80
          and
          AetherLinkIoT_storage_telemetry_spool_capacity_bytes > 0
        for: 10m
        labels:
          severity: warning
          component: telemetry-spool
          threshold: "0.80"
        annotations:
          summary: "Telemetry spool byte capacity is above 80% on {{ $labels.instance }}"
          description: >-
            The logical-byte usage ratio for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.80 for
            10 minutes (current ratio={{ $value }}). The denominator is the
            effective max_bytes value exported by that backend instance.
          runbook: "deploy/observability/README.md#capacity-near-limit"

      - alert: AetherLinkTelemetrySpoolRecordsCriticalCapacity
        expr: |
          (
            AetherLinkIoT_storage_telemetry_spool_backlog_records
            /
            AetherLinkIoT_storage_telemetry_spool_capacity_records
          ) >= 0.95
          and
          AetherLinkIoT_storage_telemetry_spool_capacity_records > 0
        for: 2m
        labels:
          severity: critical
          component: telemetry-spool
          threshold: "0.95"
        annotations:
          summary: "Telemetry spool record capacity is above 95% on {{ $labels.instance }}"
          description: >-
            Record-count usage for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.95 for
            2 minutes (current ratio={{ $value }}). New fallback records are at
            imminent risk of rejection when the configured limit is reached.
          runbook: "deploy/observability/README.md#capacity-near-limit"

      - alert: AetherLinkTelemetrySpoolBytesCriticalCapacity
        expr: |
          (
            AetherLinkIoT_storage_telemetry_spool_bytes
            /
            AetherLinkIoT_storage_telemetry_spool_capacity_bytes
          ) >= 0.95
          and
          AetherLinkIoT_storage_telemetry_spool_capacity_bytes > 0
        for: 2m
        labels:
          severity: critical
          component: telemetry-spool
          threshold: "0.95"
        annotations:
          summary: "Telemetry spool byte capacity is above 95% on {{ $labels.instance }}"
          description: >-
            Logical-byte usage for job={{ $labels.job }},
            instance={{ $labels.instance }} has remained at or above 0.95 for
            2 minutes (current ratio={{ $value }}). New fallback records are at
            imminent risk of rejection when the configured limit is reached.
          runbook: "deploy/observability/README.md#capacity-near-limit"

      - alert: AetherLinkTelemetrySpoolQuarantinePresent
        expr: |
          AetherLinkIoT_storage_telemetry_spool_quarantine_records > 0
        for: 5m
        labels:
          severity: critical
          component: telemetry-spool
        annotations:
          summary: "Telemetry spool quarantine is non-empty on {{ $labels.instance }}"
          description: >-
            The telemetry spool for job={{ $labels.job }},
            instance={{ $labels.instance }} has retained quarantine records for
            5 minutes (current records={{ $value }}). Quarantined telemetry is
            not replayed automatically and continues to consume spool capacity.
          runbook: "deploy/observability/README.md#quarantine-present"
