user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile            on;
    server_tokens       off;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 512M;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        port_in_redirect off;
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

        location /api {
            proxy_pass  http://backend:9999;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /files {
            proxy_pass  http://backend:9999;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

                # ── ThingsVis Studio 前端入口 ──────────────────────────────────────────
        location /main/ {
            default_type text/plain;
            return 503 "ThingsVis Studio is not enabled in the lightweight deployment.\n";
        }

        location = /main {
            default_type text/plain;
            return 503 "ThingsVis Studio is not enabled in the lightweight deployment.\n";
        }

        location = /main.html {
            default_type text/plain;
            return 503 "ThingsVis Studio is not enabled in the lightweight deployment.\n";
        }

        # ThingsVis API 代理
        location /thingsvis-api/ {
            default_type application/json;
            return 503 '{"code":"THINGSVIS_OPTIONAL_SERVICE_DISABLED","message":"ThingsVis Server is not enabled in the lightweight deployment."}';
        }

         # ThingsVis widget registry and module federation assets
        location = /registry.json {
            default_type application/json;
            return 503 '{"code":"THINGSVIS_OPTIONAL_SERVICE_DISABLED","message":"ThingsVis registry is not enabled in the lightweight deployment."}';
        }

        location /widgets/ {
            default_type application/json;
            return 503 '{"code":"THINGSVIS_OPTIONAL_SERVICE_DISABLED","message":"ThingsVis widgets are not enabled in the lightweight deployment."}';
        }

        location = /mf-manifest.json {
            default_type application/json;
            return 503 '{"code":"THINGSVIS_OPTIONAL_SERVICE_DISABLED","message":"ThingsVis module federation is not enabled in the lightweight deployment."}';
        }

        location / {
            index       index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }

    }
}
