# Full gateway configuration for the optional ThingsVis integration profile.
# This file is mounted only by deploy/docker-compose.optional-integrations.yml;
# the default frontend/nginx.conf remains a 503-only lightweight boundary.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    server_tokens off;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 512M;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    # Images (png/jpeg/gif) are already compressed; re-gzipping them only burns CPU.
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml application/wasm;
    # Serve the build-time precompressed `*.gz` siblings (build/plugins/compress.ts) when present.
    gzip_static on;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        port_in_redirect off;
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

        location /api {
            proxy_pass http://backend:9999;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /files {
            proxy_pass http://backend:9999;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ThingsVis Studio serves the embedded editor/viewer at its root.
        location /main/ {
            proxy_pass http://thingsvis-studio:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /main {
            return 302 /main.html;
        }

        location = /main.html {
            proxy_pass http://thingsvis-studio:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Browser-facing /thingsvis-api is rewritten to the server's /api/v1.
        location /thingsvis-api/ {
            proxy_pass http://thingsvis-server:8000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Studio assets used by the embedded runtime.
        location = /registry.json {
            proxy_pass http://thingsvis-studio:3000/registry.json;
        }

        location /widgets/ {
            proxy_pass http://thingsvis-studio:3000/widgets/;
        }

        location = /mf-manifest.json {
            proxy_pass http://thingsvis-studio:3000/mf-manifest.json;
        }

        # Vite emits content-hashed files under /assets/, so they can be cached forever.
        # A location-level add_header drops the server-level ones, hence the repeats.
        location /assets/ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        }

        # index.html references the current hashed bundles; always revalidate it
        # so a deploy is picked up without users hard-refreshing.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        }

        location / {
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }
}
