# File purpose: declares the plugin packages included in generated gmqttd imports.
# Core logic: plugin_generate.go reads this list and rewrites cmd/gmqttd/plugins.go.
# Key notes: plugin names here are runtime compatibility contracts; keep aetherlink enabled for AetherLink deployments.
# Refactor guidance: update this source file and regenerate imports instead of editing generated Go files directly.
packages:
  - admin
  - prometheus
  - federation
  - auth
  - aetherlink
  # for external plugin, use full import path
  # - github.com/DrmagicE/gmqtt/plugin/prometheus
